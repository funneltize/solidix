name: release

on:
  push:
    branches: [main]

permissions:
  contents: read
  # `jsr publish` mints its auth from this OIDC token; no JSR credential
  # exists anywhere.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.5.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Publish @solidix/solidix to JSR. `jsr publish` no-ops when the
      # umbrella version is already published, so this is safe on every
      # push; a new version ships only when the tree carries one.
      #
      # Versioning runs locally because Actions may not open PRs in this
      # repo (no changesets/action Version Packages PR): `pnpm changeset`
      # records a change, `pnpm version-packages` consumes changesets into
      # bumps + changelogs, then commit and push.
      - run: pnpm release
