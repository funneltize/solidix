name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # `jsr publish` mints its auth from this OIDC token; no JSR credential
  # exists anywhere.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.5.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # changesets/action owns versioning (the Version Packages PR). Its
      # publish step runs scripts/jsr-publish.mjs, which assembles the
      # single `@solidix/solidix` package from every workspace package's
      # dist and publishes it to JSR. `jsr publish` no-ops when the
      # umbrella version is already published, so pushes that only bump
      # internals are harmless.
      #
      # One-time setup: link @solidix/solidix to this repo in its JSR
      # package settings so the OIDC handshake is trusted.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
